# CI for the compatibility harness. It calls make targets so CI and local cannot
# drift. The golden check builds astl from source, so the job checks out
# github.com/arhuman/ansible-static-lint beside this repository and ASTL_REPO
# keeps its default. `make bench` is not run here: a wall-clock budget measured
# on shared runners flakes, so that guard stays on the maintainer's machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repositories.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: lint + vuln + golden check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astl-compatibility-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: astl-compatibility-check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arhuman/ansible-static-lint
          path: ansible-static-lint
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Pre-installed so make audit reuses them instead of bootstrapping via
      # make tools. Versions must equal the Makefile's.
      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      # make audit runs the golden check, then go mod verify, golangci-lint and
      # govulncheck. One code path, local and CI.
      - name: Audit
        run: make audit

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Conventional Commits on PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/_.-]+\))?(!)?: .+'
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::commit $sha is not Conventional Commits: '$subject'"
              fail=1
            fi
          done
          exit $fail
